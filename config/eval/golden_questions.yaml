      Hard concept eval case — keep question broad to measure retrieval improvement.
      Validated 2026-06-29 with limit=20–100, min_score=0, dedupe=false/true.
      Acceptable articles (consumer local/self-hosted AI vs paid cloud products):
      3 Google AI Ultra overpriced; 37 open-source vs Claude pricing; 40 Open WebUI hub;
      43 self-hosted NotebookLM; 46 Google NotebookLM integration criticism; 47 Ollama local LLM.
      Baseline deduped-by-article ranks: 43=#4, 40=#18, 3=#29, 46=#48, 37=#59, 47=not in top 100.
      Wrong topics crowd the top: 879 AI in production, 779 Slack multi-cloud AI serving,
      887 cloud computing explainer, 45 self-hosted abandonment (counter-argument — not acceptable).
      Do not add enterprise cloud/agent articles to expected set. Track MRR and Recall@10 over time.

