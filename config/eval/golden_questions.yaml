  - id: quantum_computing_breakthroughs
    question: What does the corpus say about quantum computing breakthroughs?
    category: negative
    expected_article_ids: []
    expected_terms: [quantum, computing]
    notes: >
      Negative control — no on-topic quantum computing content in corpus (6 articles
      mention "quantum" tangentially; none about breakthroughs).
      Validated 2026-06-29: top hit art=339 theoretical physics at score ~0.74;
      results scatter across AI research/eval articles — false-positive cluster.
      Success = low scores OR results clearly off-topic; failure = confident
      quantum-specific hits. Production min_score=0.6 would still pass top result.

